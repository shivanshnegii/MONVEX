<style>

html,body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden;max-width:100%}

.chev{width:8px;height:8px;border-right:1.5px solid var(--em2);border-bottom:1.5px solid var(--em2);transform:rotate(45deg);opacity:0;animation:chev 1.6s infinite;margin-top:-6px}.chev+.chev{margin-top:-8px;animation-delay:.2s}
.mouse{width:22px;height:34px;border:1.5px solid var(--mu);border-radius:12px;position:relative}

.wi{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--card);border-radius:10px;margin-top:10px;font-size:14px}
.tk{cursor:pointer}
#mk{position:fixed;inset:0;z-index:90;background:#f6efffd9;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));opacity:0;animation:fade .25s forwards}
.mkp{background:var(--card);border-radius:18px;padding:22px;width:min(860px,100%);max-height:100%;overflow:auto}
.mkh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.mkh small,.mks small{display:block;color:var(--mu);font-size:11px;letter-spacing:.1em}
.mkpx{font-size:clamp(24px,5vw,34px);font-weight:600;font-variant-numeric:tabular-nums}.mkpx span{font-size:15px}
.mkt{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.mkc{height:min(340px,45vh);background:#ffffff;border-radius:12px;padding:10px}.mkc svg{width:100%;height:100%;display:block}
.mks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.mks>div{background:#ffffff;border-radius:10px;padding:12px;font-variant-numeric:tabular-nums}

[hidden]{display:none!important}
.nc .more{margin-top:auto;padding-top:4px}
.cv{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#ffffff;width:100%}.cv>img:first-child{width:100%;height:100%;object-fit:cover;display:block}.cv .lg{position:absolute;left:10px;bottom:10px;width:34px;height:34px;border-radius:8px;background:#fff;padding:4px;object-fit:contain}.art .ch .cv{height:100%;aspect-ratio:auto}.cv .chg{position:absolute;right:10px;top:10px;background:#ffffffcc;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:600}.cv>svg{width:100%;height:100%;display:block}.nc .cv>svg{height:100%}
@media(max-width:560px){.wrap{padding:0 16px}.hd{height:58px}.brand{font-size:15px;letter-spacing:.18em}.ib{padding:0 11px}.feat .tx{padding:20px}.feat .ch{min-height:190px}.tk{padding:13px}.tk .p{font-size:16px}.cats{margin:32px 0 16px}.cats h2{width:100%;font-size:20px}.chip{padding:7px 12px}.brief{padding:20px}.art .ch{height:210px}main{padding:20px 0 56px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
