name: MONVEX news
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min: prices every run, news only when new stories exist
  workflow_dispatch:         # lets you run it manually from the Actions tab
permissions:
  contents: write
concurrency:
  group: monvex-news
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node news-engine.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - run: |
          git config user.name "monvex-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "news update" && git pull --rebase && git push)
